name: Prepare Release

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: "Release type"
        required: true
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    # A release commit is only ever prepared from protected main history, so a
    # dispatch from a side branch cannot produce a tag that the release workflow
    # would later refuse to build.
    if: github.event_name == 'workflow_dispatch' && github.ref_name == 'main'
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Prepare release files
        run: npm run release:prepare -- ${{ inputs.release_type }}

      - name: Commit and tag
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          TAURI_VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "$VERSION" != "$TAURI_VERSION" ]; then
            echo "package.json (${VERSION}) and src-tauri/tauri.conf.json (${TAURI_VERSION}) disagree" >&2
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/v${VERSION}" >/dev/null; then
            echo "Tag v${VERSION} already exists; a released version is never re-tagged" >&2
            exit 1
          fi
          # The script owns the list of files it rewrites, so a renamed locale
          # file cannot silently drop out of the release commit again.
          node scripts/prepare-release.mjs --list-files | xargs git add --
          git commit -m "chore: bump version to ${VERSION}"
          git tag -a "v${VERSION}" -m "AgentDeck v${VERSION}"
          git push --follow-tags origin HEAD:main
