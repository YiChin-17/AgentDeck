name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Read-only by default. Only the final publish job is allowed to write a
# release, so no build leg can make anything public on its own.
permissions:
  contents: read

env:
  EXPECTED_BUNDLE_ID: io.github.yichin17.agentdeck
  # Fixed runner-local names for the ephemeral credential material. Both the
  # import step and the always() cleanup derive their paths from these, so
  # cleanup can still find and delete the keychain when import or identity
  # validation failed before any value could be exported.
  EPHEMERAL_KEYCHAIN: agentdeck-release.keychain-db
  EPHEMERAL_KEY_DIR: private_keys
  EPHEMERAL_CERTIFICATE: certificate.p12

jobs:
  # Runs on every trigger, including workflow_dispatch, which is therefore a
  # non-publishing dry run: it proves the committed pipeline still fails closed
  # without needing any Apple credential.
  contract:
    name: Distribution contract
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Check the committed distribution contract
        run: npm run check:macos-distribution

      - name: Check the product identity
        run: npm run check:product-identity

      - name: Check that no application updater surface returned
        run: npm run check:no-app-updater

  # A Developer ID signature proves who produced the artifact, not that the
  # artifact works. Publication therefore also waits on the Phase 7 gates that
  # decide whether this commit is releasable at all. No credential is available
  # here, so the bundle it builds is an ordinary unsigned personal build.
  regression:
    name: Phase 7 regressions
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: macos-14
    permissions:
      contents: read
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: src-tauri
          save-if: false

      - name: Install frontend dependencies
        run: npm ci

      - name: Frontend production build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Locale integrity
        run: npm run check:i18n

      - name: Repository Node contracts
        run: node --test scripts/*.test.mjs

      - name: Rust tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

      # The personal-installation contract reads the default bundle path, so it
      # needs its own unsigned build rather than one of the signed per-target
      # builds above.
      - name: Build the personal installation bundle
        run: npm run tauri:build

      - name: Personal installation contract
        run: npm run check:personal-installation

  build:
    name: Build macOS (${{ matrix.arch }})
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: macos-14
    # Apple credentials exist only inside this protected environment, so no
    # other job and no manual run outside it can reach them.
    environment: macos-release
    permissions:
      contents: read
    # Apple's notary service can leave a submission "In Progress" indefinitely
    # and v1.29.0 burned the full 6-hour GitHub limit on both macOS legs. An
    # hour caps a hang while leaving real headroom for a healthy build.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            target: aarch64-apple-darwin
            dmg_arch: aarch64
          - arch: x86_64
            target: x86_64-apple-darwin
            dmg_arch: x64

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Verify tag, committed versions, and branch history
        run: |
          set -euo pipefail
          case "$GITHUB_REF_NAME" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "Refusing a ref that is not a release tag: $GITHUB_REF_NAME" >&2; exit 1 ;;
          esac
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          TAURI_VERSION="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ] || [ "$TAG_VERSION" != "$TAURI_VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json ($PKG_VERSION) or src-tauri/tauri.conf.json ($TAURI_VERSION)" >&2
            exit 1
          fi
          # A tag can point anywhere. Only a commit contained in protected main
          # history may become an official release.
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Tag commit $GITHUB_SHA is not contained in protected main history" >&2
            exit 1
          fi
          echo "VERSION=$TAG_VERSION" >> "$GITHUB_ENV"

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: src-tauri
          save-if: false

      - name: Install frontend dependencies
        run: npm ci

      # Credentials live in a runner-local, throwaway store for the length of
      # this job only. A missing or mismatched value stops the job here, before
      # anything is built, so there is no ad-hoc signed artifact to leak.
      - name: Import Developer ID credentials into an ephemeral keychain
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          umask 077
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_API_ISSUER \
                      APPLE_API_KEY APPLE_API_KEY_BASE64 APPLE_TEAM_ID; do
            if [ -z "${!name:-}" ]; then
              echo "Missing macos-release environment value: $name" >&2
              exit 1
            fi
          done

          KEYCHAIN_PATH="$RUNNER_TEMP/$EPHEMERAL_KEYCHAIN"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          CERT_PATH="$RUNNER_TEMP/$EPHEMERAL_CERTIFICATE"
          KEY_DIR="$RUNNER_TEMP/$EPHEMERAL_KEY_DIR"
          KEY_PATH="$KEY_DIR/AuthKey_$APPLE_API_KEY.p8"

          mkdir -p "$KEY_DIR"
          printf '%s' "$APPLE_API_KEY_BASE64" | base64 --decode > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          if ! grep -q 'BEGIN PRIVATE KEY' "$KEY_PATH"; then
            echo "Invalid macos-release environment value: APPLE_API_KEY_BASE64" >&2
            exit 1
          fi

          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$CERT_PATH"
          chmod 600 "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 3600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          if ! security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security >/dev/null 2>&1; then
            echo "Invalid macos-release environment value: APPLE_CERTIFICATE or APPLE_CERTIFICATE_PASSWORD" >&2
            exit 1
          fi
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
          rm -f "$CERT_PATH"

          # A structurally valid certificate from another team would still
          # produce a signature Gatekeeper accepts for somebody else's product,
          # so the identity has to match the release team explicitly.
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
            | grep 'Developer ID Application' | grep "($APPLE_TEAM_ID)" | head -n1 \
            | sed -E 's/^[[:space:]]*[0-9]+\)[[:space:]]+[0-9A-F]+[[:space:]]+"(.*)"$/\1/')"
          if [ -z "$IDENTITY" ]; then
            echo "The imported certificate has no Developer ID Application identity for the expected team" >&2
            exit 1
          fi
          echo "::add-mask::$IDENTITY"
          {
            echo "APPLE_SIGNING_IDENTITY=$IDENTITY"
            echo "APPLE_API_KEY_PATH=$KEY_PATH"
          } >> "$GITHUB_ENV"

      - name: Build signed and notarized bundles
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: npm run tauri:build -- --target ${{ matrix.target }} --bundles app,dmg

      # The bundler notarizes and staples the application, but past release runs
      # showed the disk image itself leaving the bundler without a ticket, so it
      # is submitted and stapled here.
      - name: Notarize and staple the disk image
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          set -euo pipefail
          DMG_PATH="src-tauri/target/${{ matrix.target }}/release/bundle/dmg/AgentDeck_${VERSION}_${{ matrix.dmg_arch }}.dmg"
          if [ ! -f "$DMG_PATH" ]; then
            echo "The build produced no disk image at $DMG_PATH" >&2
            exit 1
          fi
          codesign --force --sign "$APPLE_SIGNING_IDENTITY" --timestamp "$DMG_PATH"
          xcrun notarytool submit "$DMG_PATH" \
            --key "$APPLE_API_KEY_PATH" \
            --key-id "$APPLE_API_KEY" \
            --issuer "$APPLE_API_ISSUER" \
            --wait --timeout 30m
          xcrun stapler staple "$DMG_PATH"

      # Each check answers a different question, and a missing one leaves a real
      # hole: a valid signature from another team, an unstapled ticket, or a
      # disk image whose contents were never opened and inspected.
      - name: Verify Developer ID signing, notarization, and Gatekeeper
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          BUNDLE_DIR="src-tauri/target/${{ matrix.target }}/release/bundle"
          APP_PATH="$BUNDLE_DIR/macos/AgentDeck.app"
          DMG_PATH="$BUNDLE_DIR/dmg/AgentDeck_${VERSION}_${{ matrix.dmg_arch }}.dmg"

          verify_app() {
            label="$1"
            app="$2"
            echo "=== Verifying $label: $app ==="
            if [ ! -d "$app" ]; then
              echo "$label is missing at $app" >&2
              return 1
            fi
            bundle_id="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Contents/Info.plist")"
            app_version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")"
            if [ "$bundle_id" != "$EXPECTED_BUNDLE_ID" ]; then
              echo "$label reports Bundle ID $bundle_id" >&2
              return 1
            fi
            if [ "$app_version" != "$VERSION" ]; then
              echo "$label reports version $app_version, expected $VERSION" >&2
              return 1
            fi
            codesign --verify --deep --strict --verbose=2 "$app"
            # Captured once: piping into grep lets grep exit first, and the
            # SIGPIPE it sends codesign surfaces as a spurious pipeline failure.
            sig_info="$(codesign -dvvv "$app" 2>&1)"
            grep -q 'Authority=Developer ID Application:' <<<"$sig_info" || {
              echo "$label is not signed with a Developer ID Application certificate" >&2
              return 1
            }
            grep -q "TeamIdentifier=$APPLE_TEAM_ID" <<<"$sig_info" || {
              echo "$label carries an unexpected TeamIdentifier" >&2
              return 1
            }
            grep -q 'Timestamp=' <<<"$sig_info" || {
              echo "$label has no secure timestamp" >&2
              return 1
            }
            grep -qE 'flags=[^)]*runtime' <<<"$sig_info" || {
              echo "$label does not enable the hardened runtime" >&2
              return 1
            }
            xcrun stapler validate "$app"
            spctl --assess --type execute --verbose=4 "$app"
          }

          verify_app "built bundle" "$APP_PATH"

          # The disk image is what a user actually downloads, so its own ticket
          # and its contents are verified rather than assumed from the build
          # directory.
          xcrun stapler validate "$DMG_PATH"
          MOUNT_POINT="$(mktemp -d)"
          hdiutil attach "$DMG_PATH" -readonly -nobrowse -mountpoint "$MOUNT_POINT" >/dev/null
          APP_COUNT="$(find "$MOUNT_POINT" -maxdepth 1 -name '*.app' | wc -l | tr -d ' ')"
          MOUNTED_APP="$(find "$MOUNT_POINT" -maxdepth 1 -name '*.app' | head -n1)"
          if [ "$APP_COUNT" != "1" ] || [ "$(basename "$MOUNTED_APP")" != "AgentDeck.app" ]; then
            echo "The disk image must contain exactly one application named AgentDeck.app" >&2
            hdiutil detach "$MOUNT_POINT" -quiet || true
            exit 1
          fi
          verify_app "disk image bundle" "$MOUNTED_APP" || {
            hdiutil detach "$MOUNT_POINT" -quiet || true
            exit 1
          }
          hdiutil detach "$MOUNT_POINT" -quiet

      - name: Generate the SHA-256 checksum
        run: |
          set -euo pipefail
          DMG_NAME="AgentDeck_${VERSION}_${{ matrix.dmg_arch }}.dmg"
          mkdir -p dist/release
          cp "src-tauri/target/${{ matrix.target }}/release/bundle/dmg/$DMG_NAME" "dist/release/$DMG_NAME"
          cd dist/release
          shasum -a 256 "$DMG_NAME" > "$DMG_NAME.sha256"
          shasum -a 256 -c "$DMG_NAME.sha256"

      - name: Upload the verified artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: agentdeck-macos-${{ matrix.arch }}
          path: |
            dist/release/AgentDeck_*.dmg
            dist/release/AgentDeck_*.dmg.sha256
          if-no-files-found: error
          retention-days: 7

      - name: Remove the ephemeral credentials
        if: always()
        run: |
          security list-keychains -d user -s login.keychain-db || true
          security delete-keychain "$RUNNER_TEMP/$EPHEMERAL_KEYCHAIN" || true
          rm -f "$RUNNER_TEMP/$EPHEMERAL_CERTIFICATE"
          rm -rf "$RUNNER_TEMP/$EPHEMERAL_KEY_DIR"

  publish:
    name: Publish release
    needs: [contract, regression, build]
    # A manual run can never reach this job, so workflow_dispatch stays a dry run.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Download the verified artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist/incoming

      - name: Verify the complete artifact set
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist/release
          find dist/incoming -type f -name 'AgentDeck_*' -exec cp {} dist/release/ \;
          cd dist/release
          for name in "AgentDeck_${VERSION}_aarch64.dmg" "AgentDeck_${VERSION}_x64.dmg"; do
            if [ ! -f "$name" ] || [ ! -f "$name.sha256" ]; then
              echo "Missing release asset or checksum for $name" >&2
              exit 1
            fi
            shasum -a 256 -c "$name.sha256"
          done
          # Exactly two disk images and their two checksums. Anything else — a
          # missing architecture, a duplicate, or an application updater
          # artifact — stops the release here.
          ASSET_COUNT="$(find . -type f | wc -l | tr -d ' ')"
          if [ "$ASSET_COUNT" -ne 4 ]; then
            echo "Expected exactly 4 release assets, found $ASSET_COUNT" >&2
            find . -type f >&2
            exit 1
          fi

      - name: Compose the release notes
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          BODY_EN=$(sed -n "/^## \[${VERSION}\]/,/^## \[/{ /^## \[${VERSION}\]/d; /^## \[/d; p; }" CHANGELOG.md | awk -f scripts/strip-empty-sections.awk)
          BODY_ZH=$(sed -n "/^## \[${VERSION}\]/,/^## \[/{ /^## \[${VERSION}\]/d; /^## \[/d; p; }" CHANGELOG-zh.md | awk -f scripts/strip-empty-sections.awk)
          RELEASE_DATE=$(grep -m1 "^## \[${VERSION}\] - " CHANGELOG.md | sed -E "s/^## \[${VERSION}\] - ([0-9-]+).*/\1/")
          if [ -z "$RELEASE_DATE" ]; then RELEASE_DATE=$(date -u +%Y-%m-%d); fi
          PREV_TAG=$(git tag --sort=-v:refname --merged "$GITHUB_REF_NAME" | grep -v "^$GITHUB_REF_NAME$" | head -n1)
          if [ -n "$PREV_TAG" ]; then
            FULL_LINE="**完整变更**：[\`${PREV_TAG}...${GITHUB_REF_NAME}\`](https://github.com/${REPO}/compare/${PREV_TAG}...${GITHUB_REF_NAME})"
          else
            FULL_LINE="**完整变更**：首个发布版本"
          fi
          {
            echo "## AgentDeck ${GITHUB_REF_NAME}"
            echo ""
            echo "发布日期：\`${RELEASE_DATE}\`"
            echo ""
            echo "$BODY_ZH"
            echo ""
            echo "### 下载与校验"
            echo ""
            echo "- Apple silicon：\`AgentDeck_${VERSION}_aarch64.dmg\`"
            echo "- Intel：\`AgentDeck_${VERSION}_x64.dmg\`"
            echo "- 每个磁盘映像都附带同名 \`.sha256\` 文件；下载后用 \`shasum -a 256\` 重算并比对。"
            echo "- 磁盘映像与其中的应用均以 Developer ID Application 证书签名、经 Apple 公证并装订票据。"
            echo "- 本应用没有自动更新，新版本需手动下载。"
            echo ""
            echo "---"
            echo ""
            echo "<details><summary>English release notes</summary>"
            echo ""
            echo "Release date: \`${RELEASE_DATE}\`"
            echo ""
            echo "$BODY_EN"
            echo ""
            echo "</details>"
            echo ""
            echo "${FULL_LINE}"
          } > "$RUNNER_TEMP/release-notes.md"

      - name: Stage the release draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # A tag is released once. An existing release for it is a signal that
          # something already happened, never something to overwrite.
          if gh release view "$GITHUB_REF_NAME" --repo "$REPO" >/dev/null 2>&1; then
            echo "A release already exists for $GITHUB_REF_NAME; prepare a new patch version instead" >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" \
            --repo "$REPO" \
            --target "${{ github.sha }}" \
            --title "AgentDeck $GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --draft \
            dist/release/*

      - name: Verify the staged draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          gh release view "$GITHUB_REF_NAME" --repo "$REPO" \
            --json isDraft,tagName,targetCommitish,assets > "$RUNNER_TEMP/draft.json"
          if [ "$(jq -r '.isDraft' "$RUNNER_TEMP/draft.json")" != "true" ]; then
            echo "The staged release is already public" >&2
            exit 1
          fi
          if [ "$(jq -r '.targetCommitish' "$RUNNER_TEMP/draft.json")" != "${{ github.sha }}" ]; then
            echo "The staged release points at another commit" >&2
            exit 1
          fi
          ACTUAL="$(jq -r '.assets[].name' "$RUNNER_TEMP/draft.json" | sort | tr '\n' ' ')"
          EXPECTED="$(printf '%s\n' \
            "AgentDeck_${VERSION}_aarch64.dmg" \
            "AgentDeck_${VERSION}_aarch64.dmg.sha256" \
            "AgentDeck_${VERSION}_x64.dmg" \
            "AgentDeck_${VERSION}_x64.dmg.sha256" | sort | tr '\n' ' ')"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "The staged asset set is $ACTUAL, expected $EXPECTED" >&2
            exit 1
          fi
          # Re-download what a user would get and re-check the digests, so the
          # published checksums describe the hosted bytes, not the build output.
          mkdir -p "$RUNNER_TEMP/verify"
          cd "$RUNNER_TEMP/verify"
          gh release download "$GITHUB_REF_NAME" --repo "$REPO" --dir .
          for name in "AgentDeck_${VERSION}_aarch64.dmg" "AgentDeck_${VERSION}_x64.dmg"; do
            shasum -a 256 -c "$name.sha256"
          done

      - name: Publish the verified draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release edit "$GITHUB_REF_NAME" --repo "$REPO" --draft=false
          echo "Published $GITHUB_REF_NAME"
